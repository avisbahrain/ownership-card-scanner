<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Document Scanner</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
}

/* CAMERA */

#cameraContainer {
    position: absolute;
    inset: 0;
    background: #000;
    overflow: hidden;
}

#video {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;
}

/*
 Do NOT use object-fit: contain.
 contain creates black bars.
 cover fills the entire screen.
*/

#overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

/* Document guide */

#guide {
    position: absolute;

    width: 82vw;
    max-width: 700px;

    aspect-ratio: 1.586 / 1;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border: 3px solid rgba(255,255,255,.95);
    border-radius: 12px;

    box-shadow:
        0 0 0 9999px rgba(0,0,0,.35);

    transition: border-color .2s;
}

#guide.detected {
    border-color: #00e676;
}

/* Corner marks */

.corner {
    position: absolute;
    width: 35px;
    height: 35px;
}

.corner.tl {
    top: -3px;
    left: -3px;
    border-top: 5px solid white;
    border-left: 5px solid white;
    border-radius: 10px 0 0 0;
}

.corner.tr {
    top: -3px;
    right: -3px;
    border-top: 5px solid white;
    border-right: 5px solid white;
    border-radius: 0 10px 0 0;
}

.corner.bl {
    bottom: -3px;
    left: -3px;
    border-bottom: 5px solid white;
    border-left: 5px solid white;
    border-radius: 0 0 0 10px;
}

.corner.br {
    bottom: -3px;
    right: -3px;
    border-bottom: 5px solid white;
    border-right: 5px solid white;
    border-radius: 0 0 10px 0;
}

/* TOP */

#topBar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    padding:
        calc(env(safe-area-inset-top) + 14px)
        16px
        14px;

    background: linear-gradient(
        rgba(0,0,0,.75),
        rgba(0,0,0,0)
    );

    color: white;
    text-align: center;

    z-index: 10;
}

#title {
    font-size: 20px;
    font-weight: bold;
}

#instruction {
    margin-top: 6px;
    font-size: 14px;
    opacity: .9;
}

/* DETECTION STATUS */

#status {
    position: absolute;

    top: calc(env(safe-area-inset-top) + 85px);

    left: 50%;
    transform: translateX(-50%);

    z-index: 20;

    padding: 8px 14px;

    border-radius: 20px;

    background: rgba(0,0,0,.65);
    color: white;

    font-size: 13px;

    white-space: nowrap;
}

/* BOTTOM */

#bottom {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        15px
        16px
        calc(env(safe-area-inset-bottom) + 15px);

    background: linear-gradient(
        rgba(0,0,0,0),
        rgba(0,0,0,.9)
    );

    z-index: 10;
}

/* Capture */

#captureButton {
    display: block;

    width: 78px;
    height: 78px;

    margin: 0 auto 14px;

    border-radius: 50%;

    border: 6px solid white;

    background: #fff;

    box-shadow:
        0 3px 15px rgba(0,0,0,.5);

    cursor: pointer;

    position: relative;
}

#captureButton::after {
    content: "";

    position: absolute;

    width: 62px;
    height: 62px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: #e53935;
}

#captureButton:active {
    transform: scale(.94);
}

/* Buttons */

.buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
}

button {
    border: 0;

    padding: 12px 18px;

    border-radius: 10px;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
}

.secondary {
    background: rgba(255,255,255,.9);
    color: #111;
}

.primary {
    background: #1976d2;
    color: white;
}

.success {
    background: #00a86b;
    color: white;
}

/* PAGES */

#pagesPanel {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;
    top: 0;

    z-index: 100;

    background: #f5f5f5;

    display: none;

    overflow-y: auto;
}

#pagesHeader {
    position: sticky;
    top: 0;

    background: white;

    padding:
        calc(env(safe-area-inset-top) + 15px)
        15px
        15px;

    border-bottom: 1px solid #ddd;

    z-index: 5;
}

#pagesHeader h2 {
    margin: 0 0 5px;
}

#pagesHeader p {
    margin: 0;
    color: #666;
    font-size: 14px;
}

#pages {
    padding: 15px;
}

.page {
    background: white;

    border-radius: 12px;

    padding: 12px;

    margin-bottom: 15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.12);
}

.pageTitle {
    font-weight: bold;
    margin-bottom: 10px;
}

.photos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.photoBox {
    position: relative;
}

.photoBox img {
    width: 100%;
    aspect-ratio: 1.586 / 1;

    object-fit: cover;

    border-radius: 8px;

    background: #ddd;
}

.photoLabel {
    font-size: 12px;
    text-align: center;
    margin-top: 5px;
    color: #555;
}

.deletePage {
    width: 100%;
    margin-top: 10px;

    background: #ffebee;
    color: #c62828;
}

/* MODAL */

#message {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.75);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 500;
}

.messageBox {
    width: min(90%, 400px);

    background: white;

    border-radius: 15px;

    padding: 25px;

    text-align: center;
}

.messageBox h3 {
    margin-top: 0;
}

.messageBox button {
    margin-top: 15px;
    width: 100%;
}

/* PROCESSING */

#processing {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.85);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 1000;

    color: white;

    text-align: center;
}

.loader {
    width: 45px;
    height: 45px;

    border: 5px solid rgba(255,255,255,.3);
    border-top-color: white;

    border-radius: 50%;

    animation: spin .8s linear infinite;

    margin: 0 auto 15px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* Desktop */

@media (min-width: 800px) {

    #guide {
        width: 650px;
    }

    #bottom {
        padding-bottom: 25px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="cameraContainer">

        <video
            id="video"
            autoplay
            muted
            playsinline>
        </video>

        <div id="overlay">

            <div id="guide">

                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>

            </div>

        </div>

        <div id="topBar">

            <div id="title">
                Document Scanner
            </div>

            <div id="instruction">
                Capture FRONT
            </div>

        </div>

        <div id="status">
            Position document inside the frame
        </div>

        <div id="bottom">

            <button
                id="captureButton"
                aria-label="Capture">
            </button>

            <div class="buttons">

                <button
                    class="secondary"
                    onclick="switchCamera()">
                    🔄 Camera
                </button>

                <button
                    class="secondary"
                    onclick="openPages()">
                    📄 Pages (<span id="pageCount">0</span>)
                </button>

            </div>

        </div>

    </div>


    <!-- PAGES -->

    <div id="pagesPanel">

        <div id="pagesHeader">

            <h2>Scanned Pages</h2>

            <p>
                Each page contains Front + Back.
            </p>

            <div class="buttons" style="margin-top:12px">

                <button
                    class="primary"
                    onclick="continueScanning()">
                    📷 Continue Scanning
                </button>

                <button
                    class="success"
                    onclick="createPDF()">
                    📄 Create PDF
                </button>

            </div>

        </div>

        <div id="pages"></div>

    </div>


    <!-- MESSAGE -->

    <div id="message">

        <div class="messageBox">

            <h3 id="messageTitle">
                Error
            </h3>

            <p id="messageText"></p>

            <button
                class="primary"
                onclick="closeMessage()">
                OK
            </button>

        </div>

    </div>


    <!-- PROCESSING -->

    <div id="processing">

        <div>

            <div class="loader"></div>

            <div id="processingText">
                Creating PDF...
            </div>

        </div>

    </div>

</div>


<!-- Hidden canvas -->

<canvas id="canvas"></canvas>


<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");

const guide = document.getElementById("guide");
const instruction = document.getElementById("instruction");
const statusText = document.getElementById("status");

const captureButton =
    document.getElementById("captureButton");

const pageCount =
    document.getElementById("pageCount");

const pagesPanel =
    document.getElementById("pagesPanel");

const pagesContainer =
    document.getElementById("pages");

const message =
    document.getElementById("message");

const messageTitle =
    document.getElementById("messageTitle");

const messageText =
    document.getElementById("messageText");

const processing =
    document.getElementById("processing");

const processingText =
    document.getElementById("processingText");


let stream = null;

let facingMode = "environment";

let currentSide = "front";

let currentFront = null;

let pagesData = [];


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    try {

        if (stream) {

            stream.getTracks().forEach(
                track => track.stop()
            );

        }

        stream = await navigator.mediaDevices.getUserMedia({

            video: {

                facingMode: {
                    ideal: facingMode
                },

                width: {
                    ideal: 1920
                },

                height: {
                    ideal: 1080
                },

                aspectRatio: {
                    ideal: 16 / 9
                }
            },

            audio: false

        });

        video.srcObject = stream;

        await video.play();

        statusText.textContent =
            "Position document inside the frame";

        guide.classList.remove("detected");

    } catch (error) {

        console.error(error);

        showMessage(
            "Camera Error",
            "Could not open the camera. Please allow camera permission and make sure the site is using HTTPS."
        );

    }

}


/* =========================================================
   SWITCH CAMERA
========================================================= */

async function switchCamera() {

    facingMode =
        facingMode === "environment"
            ? "user"
            : "environment";

    await startCamera();

}


/* =========================================================
   SIDE
========================================================= */

function updateInstruction() {

    if (currentSide === "front") {

        instruction.textContent =
            "Capture FRONT";

        statusText.textContent =
            "Position FRONT inside the frame";

    } else {

        instruction.textContent =
            "Capture BACK";

        statusText.textContent =
            "Position BACK inside the frame";

    }

}


/* =========================================================
   CAPTURE
========================================================= */

captureButton.addEventListener(
    "click",
    capturePhoto
);


function capturePhoto() {

    if (!video.videoWidth || !video.videoHeight) {

        showMessage(
            "Camera Not Ready",
            "Please wait for the camera to start."
        );

        return;
    }


    /*
      Capture at the camera's REAL resolution.
      This avoids blurry screenshots.
    */

    const sourceWidth =
        video.videoWidth;

    const sourceHeight =
        video.videoHeight;


    /*
      Center crop using credit-card ratio.

      ISO/IEC 7810 ID-1 ratio:

      85.60 / 53.98 = 1.586
    */

    const targetRatio =
        1.586;


    let cropWidth;
    let cropHeight;

    if (
        sourceWidth / sourceHeight
        >
        targetRatio
    ) {

        cropHeight =
            sourceHeight;

        cropWidth =
            sourceHeight * targetRatio;

    } else {

        cropWidth =
            sourceWidth;

        cropHeight =
            sourceWidth / targetRatio;

    }


    const sx =
        (sourceWidth - cropWidth) / 2;

    const sy =
        (sourceHeight - cropHeight) / 2;


    /*
      High resolution output.
    */

    const outputWidth = 1712;
    const outputHeight = 1079;


    canvas.width =
        outputWidth;

    canvas.height =
        outputHeight;


    const ctx =
        canvas.getContext("2d");


    /*
      If front camera is used,
      mirror the image.
    */

    if (facingMode === "user") {

        ctx.translate(
            outputWidth,
            0
        );

        ctx.scale(-1, 1);

    }


    ctx.drawImage(

        video,

        sx,
        sy,
        cropWidth,
        cropHeight,

        0,
        0,
        outputWidth,
        outputHeight

    );


    const image =
        canvas.toDataURL(
            "image/jpeg",
            0.95
        );


    if (currentSide === "front") {

        currentFront = image;

        currentSide = "back";

        updateInstruction();

        /*
          Small visual confirmation.
        */

        flashScreen();

    } else {

        if (!currentFront) {

            showMessage(
                "Error",
                "Front image is missing."
            );

            return;
        }


        pagesData.push({

            front: currentFront,

            back: image

        });


        currentFront = null;

        currentSide = "front";

        updateInstruction();

        updatePageCount();

        renderPages();

        flashScreen();

    }

}


/* =========================================================
   FLASH
========================================================= */

function flashScreen() {

    const flash =
        document.createElement("div");

    flash.style.position = "fixed";
    flash.style.inset = "0";
    flash.style.background = "white";
    flash.style.opacity = "0.85";
    flash.style.zIndex = "10000";
    flash.style.pointerEvents = "none";

    document.body.appendChild(flash);

    setTimeout(() => {

        flash.style.opacity = "0";

        flash.style.transition =
            "opacity .2s";

    }, 50);

    setTimeout(() => {

        flash.remove();

    }, 300);

}


/* =========================================================
   PAGE COUNT
========================================================= */

function updatePageCount() {

    pageCount.textContent =
        pagesData.length;

}


/* =========================================================
   RENDER PAGES
========================================================= */

function renderPages() {

    pagesContainer.innerHTML = "";

    if (pagesData.length === 0) {

        pagesContainer.innerHTML = `
            <div style="
                text-align:center;
                padding:40px;
                color:#777;
            ">
                No pages scanned yet.
            </div>
        `;

        return;
    }


    pagesData.forEach(
        (page, index) => {

            const element =
                document.createElement("div");

            element.className =
                "page";

            element.innerHTML = `

                <div class="pageTitle">
                    Page ${index + 1}
                </div>

                <div class="photos">

                    <div class="photoBox">

                        <img
                            src="${page.front}"
                            alt="Front">

                        <div class="photoLabel">
                            FRONT
                        </div>

                    </div>

                    <div class="photoBox">

                        <img
                            src="${page.back}"
                            alt="Back">

                        <div class="photoLabel">
                            BACK
                        </div>

                    </div>

                </div>

                <button
                    class="deletePage"
                    onclick="deletePage(${index})">

                    🗑 Delete Page

                </button>
            `;


            pagesContainer.appendChild(
                element
            );

        }
    );

}


/* =========================================================
   DELETE PAGE
========================================================= */

function deletePage(index) {

    if (
        !confirm(
            `Delete Page ${index + 1}?`
        )
    ) {

        return;
    }


    pagesData.splice(
        index,
        1
    );

    updatePageCount();

    renderPages();

}


/* =========================================================
   OPEN PAGES
========================================================= */

function openPages() {

    pagesPanel.style.display =
        "block";

    renderPages();

}


/* =========================================================
   CONTINUE
========================================================= */

function continueScanning() {

    pagesPanel.style.display =
        "none";

}


/* =========================================================
   CREATE PDF
========================================================= */

async function createPDF() {

    if (pagesData.length === 0) {

        showMessage(
            "No Pages",
            "Please scan at least one page before creating the PDF."
        );

        return;

    }


    /*
      If user has captured FRONT but
      hasn't captured BACK, prevent PDF.
    */

    if (currentFront) {

        showMessage(
            "Incomplete Page",
            "You captured a FRONT image but not the BACK image. Please capture the BACK first."
        );

        return;

    }


    processing.style.display =
        "flex";

    processingText.textContent =
        "Creating PDF...";


    try {

        const {
            jsPDF
        } = window.jspdf;


        /*
          A4 PDF.

          Landscape is used because
          each page contains two images.
        */

        const pdf =
            new jsPDF({

                orientation: "landscape",

                unit: "mm",

                format: "a4",

                compress: true

            });


        const pdfWidth =
            297;

        const pdfHeight =
            210;


        /*
          Margins
        */

        const margin =
            12;

        const gap =
            8;


        const availableWidth =
            pdfWidth
            -
            margin * 2
            -
            gap;


        const imageWidth =
            availableWidth / 2;


        /*
          Credit-card ratio.
        */

        const imageHeight =
            imageWidth / 1.586;


        const y =
            (pdfHeight - imageHeight) / 2;


        for (
            let i = 0;
            i < pagesData.length;
            i++
        ) {

            if (i > 0) {

                pdf.addPage();

            }


            processingText.textContent =
                `Creating PDF page ${i + 1} of ${pagesData.length}...`;


            const page =
                pagesData[i];


            /*
              FRONT
            */

            pdf.addImage(

                page.front,

                "JPEG",

                margin,

                y,

                imageWidth,

                imageHeight,

                undefined,

                "FAST"

            );


            /*
              BACK
            */

            pdf.addImage(

                page.back,

                "JPEG",

                margin
                +
                imageWidth
                +
                gap,

                y,

                imageWidth,

                imageHeight,

                undefined,

                "FAST"

            );


            /*
              Labels
            */

            pdf.setFontSize(8);

            pdf.text(
                "FRONT",
                margin,
                y - 3
            );

            pdf.text(
                "BACK",
                margin
                +
                imageWidth
                +
                gap,
                y - 3
            );

        }


        /*
          Save.
        */

        const filename =
            "scanned-document-" +
            new Date()
                .toISOString()
                .slice(0,10)
            +
            ".pdf";


        pdf.save(filename);


        processing.style.display =
            "none";


    } catch (error) {

        console.error(
            "PDF ERROR:",
            error
        );

        processing.style.display =
            "none";

        showMessage(
            "PDF Creation Failed",
            "The PDF could not be created. Please try again."
        );

    }

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    title,
    text
) {

    messageTitle.textContent =
        title;

    messageText.textContent =
        text;

    message.style.display =
        "flex";

}


function closeMessage() {

    message.style.display =
        "none";

}


/* =========================================================
   INITIALIZE
========================================================= */

window.addEventListener(
    "load",
    async () => {

        updateInstruction();

        updatePageCount();

        await startCamera();

    }
);


/* =========================================================
   STOP CAMERA WHEN LEAVING
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

    }
);

</script>

</body>
</html>
