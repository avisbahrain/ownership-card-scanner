<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="format-detection" content="telephone=no">
<title>Document Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#0b0d10;
    --panel:#1b1f24;
    --panel-2:#15181c;
    --accent:#ff3b30;
    --accent-dark:#c92a20;
    --overlay:rgba(0,0,0,0.45);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-left:env(safe-area-inset-left,0px);
    --safe-right:env(safe-area-inset-right,0px);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }

  #app{ position:fixed; inset:0; width:100%; height:100%; }

  .screen{ position:absolute; inset:0; display:none; width:100%; height:100%; }
  .screen.active{ display:block; }

  /* ---------- CAMERA SCREEN ---------- */
  #cameraScreen{ overflow:hidden; background:#000; }

  #video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    background:#000;
    display:block;
  }
  #video.mirrored{ transform:scaleX(-1); }
  #video.filter-color{ filter:contrast(1.08) saturate(1.15); }
  #video.filter-gray{ filter:grayscale(1) contrast(1.12); }
  #video.filter-bw{ filter:grayscale(1) contrast(1.5) brightness(1.05); }
  #video.filter-original{ filter:none; }

  #guideMask{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:3;
  }
  #guideBox{
    position:relative;
    width:min(88vw, calc(88vh * 1.586));
    aspect-ratio:1.586 / 1;
    max-width:640px;
    border-radius:14px;
    box-shadow:0 0 0 2000px var(--overlay);
  }
  .corner{
    position:absolute; width:26px; height:26px;
    border:3px solid #fff;
  }
  .corner.tl{ top:-3px; left:-3px; border-right:none; border-bottom:none; border-top-left-radius:8px; }
  .corner.tr{ top:-3px; right:-3px; border-left:none; border-bottom:none; border-top-right-radius:8px; }
  .corner.bl{ bottom:-3px; left:-3px; border-right:none; border-top:none; border-bottom-left-radius:8px; }
  .corner.br{ bottom:-3px; right:-3px; border-left:none; border-top:none; border-bottom-right-radius:8px; }

  #topBar{
    position:absolute; top:0; left:0; right:0;
    padding:calc(var(--safe-top) + 16px) 16px 0 16px;
    text-align:center;
    pointer-events:none;
    z-index:5;
  }
  #instruction{
    display:inline-block;
    font-size:18px; font-weight:700; letter-spacing:0.2px;
    background:rgba(0,0,0,0.35);
    padding:8px 18px;
    border-radius:20px;
    backdrop-filter:blur(6px);
  }
  #detectionStatus{
    margin-top:10px;
    display:inline-block;
    font-size:12.5px;
    padding:6px 14px;
    border-radius:16px;
    background:rgba(0,0,0,0.35);
    color:rgba(255,255,255,0.85);
    backdrop-filter:blur(6px);
    transition:background 0.2s ease, color 0.2s ease;
  }
  #detectionStatus.detected{
    background:rgba(52,199,89,0.28);
    color:#7CFF9E;
  }

  #filterBtn{
    margin-top:10px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:600;
    padding:7px 15px;
    border-radius:16px;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.3);
    color:#fff;
    backdrop-filter:blur(6px);
    pointer-events:auto;
  }
  #filterBtn:active{ background:rgba(255,255,255,0.28); }

  #flashOverlay{
    position:absolute; inset:0; background:#fff; opacity:0;
    pointer-events:none; z-index:9;
  }
  #flashOverlay.flash{ animation:flashAnim 260ms ease-out; }
  @keyframes flashAnim{ 0%{opacity:0.85;} 100%{opacity:0;} }

  #bottomBar{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 calc(var(--safe-right) + 26px) calc(var(--safe-bottom) + 26px) calc(var(--safe-left) + 26px);
    z-index:5;
  }

  .iconBtn{
    width:52px; height:52px; border-radius:50%;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.3);
    color:#fff; font-size:22px;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px);
  }
  .iconBtn:active{ background:rgba(255,255,255,0.28); }

  .pillBtn{
    padding:11px 18px; border-radius:22px;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.3);
    color:#fff; font-size:14px; font-weight:600;
    backdrop-filter:blur(6px);
    white-space:nowrap;
  }
  .pillBtn:active{ background:rgba(255,255,255,0.28); }

  #captureBtn{
    width:78px; height:78px; border-radius:50%;
    background:var(--accent);
    border:5px solid #fff;
    box-shadow:0 2px 16px rgba(0,0,0,0.5);
    padding:0;
    flex-shrink:0;
  }
  #captureBtn:active{ background:var(--accent-dark); transform:scale(0.94); }

  button{ cursor:pointer; }

  /* ---------- PAGES SCREEN ---------- */
  #pagesScreen{
    background:var(--panel-2);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:calc(var(--safe-top) + 20px) calc(var(--safe-right) + 18px) calc(var(--safe-bottom) + 18px) calc(var(--safe-left) + 18px);
  }
  #pagesHeader{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; gap:10px;
  }
  #pagesHeader h1{ font-size:20px; margin:0; }
  #backToCameraBtn{
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff; padding:10px 16px; border-radius:20px; font-size:13px; font-weight:600;
    white-space:nowrap;
  }
  #pagesEmpty{
    text-align:center; opacity:0.6; font-size:14px; margin-top:60px;
  }
  #pagesList{ display:flex; flex-direction:column; gap:14px; }
  .pageCard{
    background:var(--panel);
    border-radius:14px; padding:14px;
    display:flex; align-items:center; gap:12px;
  }
  .pageMeta{ font-size:14px; font-weight:700; width:52px; flex-shrink:0; }
  .pageThumbs{ display:flex; gap:10px; flex:1; }
  .thumbWrap{ text-align:center; }
  .thumbWrap img{
    width:auto; height:66px; aspect-ratio:1.586/1; object-fit:cover;
    border-radius:6px; border:1px solid rgba(255,255,255,0.15);
    display:block;
  }
  .thumbLabel{ font-size:10px; opacity:0.6; margin-top:4px; letter-spacing:0.5px; }
  .deleteBtn{
    background:rgba(255,59,48,0.15); color:#ff6459;
    border:1px solid rgba(255,59,48,0.4); border-radius:9px;
    padding:9px 12px; font-size:12.5px; font-weight:600; flex-shrink:0;
  }
  .deleteBtn:active{ background:rgba(255,59,48,0.3); }

  #pagesFooter{
    position:sticky; bottom:0; padding-top:16px; background:linear-gradient(to top, var(--panel-2) 60%, transparent);
  }
  #createPdfBtn{
    width:100%; padding:16px; border-radius:14px;
    background:var(--accent); color:#fff; font-weight:700; font-size:16px; border:none;
  }
  #createPdfBtn:active{ background:var(--accent-dark); }
  #createPdfBtn:disabled{ opacity:0.6; }

  /* ---------- PERMISSION / ERROR SCREEN ---------- */
  #permissionScreen{
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .permissionBox{ max-width:380px; text-align:center; }
  .permissionBox .icon{ font-size:44px; margin-bottom:14px; }
  .permissionBox h2{ margin:0 0 10px 0; font-size:19px; }
  .permissionBox p{ opacity:0.75; line-height:1.55; margin:0 0 24px 0; font-size:14px; }
  #retryCamBtn{
    padding:13px 30px; border-radius:24px;
    background:var(--accent); border:none; color:#fff; font-weight:700; font-size:15px;
  }
  #retryCamBtn:active{ background:var(--accent-dark); }

  /* ---------- TOAST ---------- */
  #toast{
    position:fixed; left:50%; bottom:calc(var(--safe-bottom) + 34px);
    transform:translateX(-50%);
    background:rgba(25,25,28,0.96);
    border:1px solid rgba(255,255,255,0.1);
    padding:13px 18px; border-radius:12px; font-size:14px;
    z-index:50; max-width:88vw; text-align:center;
    box-shadow:0 6px 24px rgba(0,0,0,0.4);
  }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app">

  <!-- CAMERA SCREEN -->
  <div id="cameraScreen" class="screen active">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="captureCanvas" class="hidden"></canvas>
    <div id="flashOverlay"></div>

    <div id="guideMask">
      <div id="guideBox">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
      </div>
    </div>

    <div id="topBar">
      <div id="instruction">Capture FRONT</div><br>
      <div id="detectionStatus">Position document inside the frame</div><br>
      <button id="filterBtn" aria-label="Change scan style">&#127912; Color Enhance</button>
    </div>

    <div id="bottomBar">
      <button id="switchCamBtn" class="iconBtn" aria-label="Switch camera">&#8635;</button>
      <button id="captureBtn" aria-label="Capture photo"></button>
      <button id="pagesBtn" class="pillBtn">Pages (0)</button>
    </div>
  </div>

  <!-- PAGES SCREEN -->
  <div id="pagesScreen" class="screen">
    <div id="pagesHeader">
      <h1>Scanned Pages</h1>
      <button id="backToCameraBtn">Continue Scanning</button>
    </div>
    <div id="pagesEmpty">No pages yet. Go back and scan a document.</div>
    <div id="pagesList"></div>
    <div id="pagesFooter">
      <button id="createPdfBtn">Create PDF</button>
    </div>
  </div>

  <!-- PERMISSION / CAMERA ERROR SCREEN -->
  <div id="permissionScreen" class="screen">
    <div class="permissionBox">
      <div class="icon">&#128247;</div>
      <h2 id="permTitle">Camera access needed</h2>
      <p id="permMessage">This app needs access to your camera to scan documents.</p>
      <button id="retryCamBtn">Retry</button>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
</div>

<script>
(function(){
  "use strict";

  // ---------------- STATE ----------------
  var currentStream = null;
  var facingMode = "environment";
  var pendingFront = null;   // dataURL waiting for its BACK
  var pages = [];            // { front: dataURL, back: dataURL }
  var currentFilterMode = "color"; // "color" | "gray" | "bw" | "original"
  var FILTER_MODES = ["color", "gray", "bw", "original"];
  var FILTER_LABELS = {
    color: "\u{1F3A8} Color Enhance",
    gray: "\u26AA Grayscale",
    bw: "\u25D1 B&W",
    original: "\u{1F4F7} Original"
  };
  var detectionInterval = null;
  var detectionCanvas = null;
  var detectionCtx = null;
  var toastTimer = null;

  // ---------------- ELEMENT REFS ----------------
  function $(id){ return document.getElementById(id); }

  // ---------------- SCREEN MANAGEMENT ----------------
  function showScreen(id){
    var screens = document.querySelectorAll(".screen");
    for (var i = 0; i < screens.length; i++){
      screens[i].classList.remove("active");
    }
    $(id).classList.add("active");
  }

  // ---------------- TOAST ----------------
  function showToast(msg){
    var el = $("toast");
    el.textContent = msg;
    el.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.add("hidden"); }, 3400);
  }

  // ---------------- CAMERA ----------------
  function stopCamera(){
    if (currentStream){
      var tracks = currentStream.getTracks();
      for (var i = 0; i < tracks.length; i++){ tracks[i].stop(); }
      currentStream = null;
    }
    stopDetectionLoop();
  }

  function startCamera(mode){
    stopCamera();

    if (!window.isSecureContext && location.hostname !== "localhost" && location.hostname !== "127.0.0.1"){
      handleCameraError({ name: "InsecureContextError" });
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      handleCameraError({ name: "NotSupportedError" });
      return;
    }

    var constraints = {
      audio: false,
      video: {
        facingMode: { ideal: mode },
        width: { ideal: 4096 },
        height: { ideal: 2160 }
      }
    };

    navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
      onStreamReady(stream, mode);
    }).catch(function(err){
      if (err && err.name === "OverconstrainedError"){
        // Retry once with relaxed constraints before giving up
        navigator.mediaDevices.getUserMedia({ audio:false, video: { facingMode: mode } })
          .then(function(stream){ onStreamReady(stream, mode); })
          .catch(function(err2){ handleCameraError(err2); });
      } else {
        handleCameraError(err);
      }
    });
  }

  function onStreamReady(stream, mode){
    currentStream = stream;
    facingMode = mode;
    var video = $("video");
    video.srcObject = stream;
    video.classList.toggle("mirrored", mode === "user");

    var started = false;
    function tryPlay(){
      if (started) return;
      started = true;
      video.play().then(function(){
        showScreen("cameraScreen");
        startDetectionLoop();
      }).catch(function(){
        // Autoplay might be blocked momentarily; a user tap on capture will still work
        showScreen("cameraScreen");
        startDetectionLoop();
      });
    }

    if (video.readyState >= 1){
      tryPlay();
    } else {
      video.onloadedmetadata = tryPlay;
    }
  }

  function handleCameraError(err){
    console.error("Camera error:", err);
    var name = err && err.name;
    var title = "Camera error";
    var msg = "Something went wrong while starting the camera. Tap Retry to try again.";

    if (name === "InsecureContextError"){
      title = "Secure connection required";
      msg = "Camera access requires HTTPS or localhost. Please open this page over a secure connection.";
    } else if (name === "NotSupportedError"){
      title = "Camera not supported";
      msg = "Your browser does not support camera access (getUserMedia is unavailable).";
    } else if (name === "NotAllowedError" || name === "PermissionDeniedError" || name === "SecurityError"){
      title = "Camera permission denied";
      msg = "Please allow camera access for this site in your browser settings, then tap Retry.";
    } else if (name === "NotFoundError" || name === "DevicesNotFoundError"){
      title = "No camera found";
      msg = "No camera device could be found on this device.";
    } else if (name === "NotReadableError" || name === "TrackStartError"){
      title = "Camera already in use";
      msg = "The camera may be in use by another app or browser tab. Close it and tap Retry.";
    }

    $("permTitle").textContent = title;
    $("permMessage").textContent = msg;
    showScreen("permissionScreen");
  }

  function switchCamera(){
    var next = facingMode === "environment" ? "user" : "environment";
    startCamera(next);
  }

  // ---------------- DOCUMENT DETECTION (status only, never blocks capture) ----------------
  function startDetectionLoop(){
    stopDetectionLoop();
    if (!detectionCanvas){
      detectionCanvas = document.createElement("canvas");
      detectionCanvas.width = 64;
      detectionCanvas.height = 40;
      detectionCtx = detectionCanvas.getContext("2d", { willReadFrequently: true });
    }
    detectionInterval = setInterval(runDetectionSample, 450);
  }

  function stopDetectionLoop(){
    if (detectionInterval){
      clearInterval(detectionInterval);
      detectionInterval = null;
    }
  }

  function runDetectionSample(){
    try{
      var video = $("video");
      if (!video.videoWidth || !video.videoHeight) return;

      var region = computeGuideRegionInVideo();
      if (!region) return;

      detectionCtx.drawImage(video, region.srcX, region.srcY, region.srcW, region.srcH, 0, 0, 64, 40);
      var data = detectionCtx.getImageData(0, 0, 64, 40).data;

      var energy = 0;
      for (var y = 1; y < 39; y++){
        for (var x = 1; x < 63; x++){
          var i = (y * 64 + x) * 4;
          var iR = (y * 64 + x + 1) * 4;
          var iD = ((y + 1) * 64 + x) * 4;
          var lum = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
          var lumR = 0.299 * data[iR] + 0.587 * data[iR+1] + 0.114 * data[iR+2];
          var lumD = 0.299 * data[iD] + 0.587 * data[iD+1] + 0.114 * data[iD+2];
          energy += Math.abs(lum - lumR) + Math.abs(lum - lumD);
        }
      }
      var avgEnergy = energy / (62 * 38);
      var statusEl = $("detectionStatus");
      if (avgEnergy > 7){
        statusEl.textContent = "Document detected — ready to capture";
        statusEl.classList.add("detected");
      } else {
        statusEl.textContent = "Position document inside the frame";
        statusEl.classList.remove("detected");
      }
    } catch(e){
      // Detection is best-effort only; never let it interfere with capture
    }
  }

  // ---------------- GEOMETRY: map the on-screen guide box to native video pixels ----------------
  // The <video> uses object-fit:cover, so it is uniformly scaled to fill the
  // viewport and the excess is cropped equally from the edges. This computes
  // the guide rectangle's location in the video's native pixel space.
  function computeGuideRegionInVideo(){
    var video = $("video");
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;

    var guideRect = $("guideBox").getBoundingClientRect();
    var videoRect = video.getBoundingClientRect();

    var dispW = videoRect.width, dispH = videoRect.height;
    if (!dispW || !dispH) return null;

    var scale = Math.max(dispW / vw, dispH / vh);
    var renderedW = vw * scale, renderedH = vh * scale;
    var offsetX = (renderedW - dispW) / 2;
    var offsetY = (renderedH - dispH) / 2;

    var relLeft = guideRect.left - videoRect.left;
    var relTop = guideRect.top - videoRect.top;

    var srcX = (relLeft + offsetX) / scale;
    var srcY = (relTop + offsetY) / scale;
    var srcW = guideRect.width / scale;
    var srcH = guideRect.height / scale;

    // Clamp to valid bounds
    srcX = Math.max(0, Math.min(srcX, vw - 2));
    srcY = Math.max(0, Math.min(srcY, vh - 2));
    srcW = Math.max(2, Math.min(srcW, vw - srcX));
    srcH = Math.max(2, Math.min(srcH, vh - srcY));

    return { srcX: srcX, srcY: srcY, srcW: srcW, srcH: srcH };
  }

  // ---------------- CAPTURE ----------------
  function triggerFlash(){
    var el = $("flashOverlay");
    el.classList.remove("flash");
    void el.offsetWidth; // restart animation
    el.classList.add("flash");
  }

  function setInstruction(text){
    $("instruction").textContent = text;
  }

  function updatePagesButton(){
    $("pagesBtn").textContent = "Pages (" + pages.length + ")";
  }

  // ---------------- SCAN STYLE / DOC ENHANCEMENT ----------------
  function cycleFilterMode(){
    var idx = FILTER_MODES.indexOf(currentFilterMode);
    idx = (idx + 1) % FILTER_MODES.length;
    currentFilterMode = FILTER_MODES[idx];
    updateFilterUI();
  }

  function updateFilterUI(){
    $("filterBtn").innerHTML = FILTER_LABELS[currentFilterMode];
    var video = $("video");
    video.classList.remove("filter-color", "filter-gray", "filter-bw", "filter-original");
    video.classList.add("filter-" + currentFilterMode);
  }

  function clamp255(v){ return v < 0 ? 0 : (v > 255 ? 255 : v); }

  // Finds the pixel value at which `pct` of the histogram lies below (low)
  // and above (high) it, so the stretch below ignores extreme outlier pixels.
  function percentileRange(hist, total, pct){
    var thresh = total * pct;
    var cum = 0, low = 0, high = 255, v;
    for (v = 0; v < 256; v++){
      cum += hist[v];
      if (cum >= thresh){ low = v; break; }
    }
    cum = 0;
    for (v = 255; v >= 0; v--){
      cum += hist[v];
      if (cum >= thresh){ high = v; break; }
    }
    if (high <= low){ low = 0; high = 255; }
    return { low: low, high: high };
  }

  // Applies a scanner-app style enhancement directly to the captured pixels:
  // "color" auto-levels each RGB channel (fixes color cast / dim lighting,
  // like auto white balance) plus a contrast + saturation lift; "gray" and
  // "bw" convert to luminance first, with "bw" applying a stronger S-curve
  // for a crisp, high-contrast printed-page look.
  function applyDocStyleFilter(imageData, mode){
    if (mode === "original") return;

    var data = imageData.data;
    var w = imageData.width, h = imageData.height;
    var n = w * h, p, idx;

    if (mode === "color"){
      var histR = new Uint32Array(256), histG = new Uint32Array(256), histB = new Uint32Array(256);
      for (p = 0; p < n; p++){
        idx = p * 4;
        histR[data[idx]]++; histG[data[idx + 1]]++; histB[data[idx + 2]]++;
      }
      var rr = percentileRange(histR, n, 0.006);
      var gg = percentileRange(histG, n, 0.006);
      var bb = percentileRange(histB, n, 0.006);
      var rRange = Math.max(1, rr.high - rr.low);
      var gRange = Math.max(1, gg.high - gg.low);
      var bRange = Math.max(1, bb.high - bb.low);
      var contrastBoost = 1.06, satBoost = 1.12;

      for (p = 0; p < n; p++){
        idx = p * 4;
        var r = clamp255((data[idx] - rr.low) * 255 / rRange);
        var g = clamp255((data[idx + 1] - gg.low) * 255 / gRange);
        var b = clamp255((data[idx + 2] - bb.low) * 255 / bRange);
        r = clamp255((r - 128) * contrastBoost + 128);
        g = clamp255((g - 128) * contrastBoost + 128);
        b = clamp255((b - 128) * contrastBoost + 128);
        var gray = 0.299 * r + 0.587 * g + 0.114 * b;
        data[idx] = clamp255(gray + (r - gray) * satBoost);
        data[idx + 1] = clamp255(gray + (g - gray) * satBoost);
        data[idx + 2] = clamp255(gray + (b - gray) * satBoost);
      }
    } else {
      var hist = new Uint32Array(256);
      var lum = new Float32Array(n);
      for (p = 0; p < n; p++){
        idx = p * 4;
        var l = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
        lum[p] = l;
        hist[Math.round(l)]++;
      }
      var range = percentileRange(hist, n, 0.006);
      var span = Math.max(1, range.high - range.low);

      if (mode === "gray"){
        var contrastBoost2 = 1.05;
        for (p = 0; p < n; p++){
          idx = p * 4;
          var v = clamp255((lum[p] - range.low) * 255 / span);
          v = clamp255((v - 128) * contrastBoost2 + 128);
          data[idx] = v; data[idx + 1] = v; data[idx + 2] = v;
        }
      } else if (mode === "bw"){
        for (p = 0; p < n; p++){
          idx = p * 4;
          var v2 = clamp255((lum[p] - range.low) * 255 / span);
          var norm = v2 / 255;
          var curved = norm < 0.5
            ? 0.5 * Math.pow(norm * 2, 1.6)
            : 1 - 0.5 * Math.pow((1 - norm) * 2, 1.6);
          var out = clamp255(curved * 255);
          data[idx] = out; data[idx + 1] = out; data[idx + 2] = out;
        }
      }
    }
  }

  function captureFrame(){
    var video = $("video");
    if (!video || video.readyState < 2 || !video.videoWidth){
      showToast("Camera is still starting up — try again in a moment.");
      return;
    }

    var region = computeGuideRegionInVideo();
    if (!region){
      showToast("Could not read the camera frame. Please try again.");
      return;
    }

    var canvas = $("captureCanvas");
    var outW = Math.round(region.srcW);
    var outH = Math.round(region.srcH);
    canvas.width = outW;
    canvas.height = outH;

    var ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, outW, outH);
    // Note: we always draw directly from the raw (un-mirrored) video frame.
    // The <video> element is CSS-mirrored for a natural front-camera preview,
    // but that transform never affects drawImage(), so the captured image is
    // automatically correctly oriented (not mirrored) for both cameras.
    try{
      ctx.drawImage(video, region.srcX, region.srcY, region.srcW, region.srcH, 0, 0, outW, outH);
      if (currentFilterMode !== "original"){
        var imageData = ctx.getImageData(0, 0, outW, outH);
        applyDocStyleFilter(imageData, currentFilterMode);
        ctx.putImageData(imageData, 0, 0);
      }
    } catch(e){
      showToast("Capture failed. Please try again.");
      return;
    }

    var dataURL = canvas.toDataURL("image/jpeg", 0.95);
    triggerFlash();
    handleCapturedImage(dataURL);
  }

  function handleCapturedImage(dataURL){
    if (pendingFront === null){
      pendingFront = dataURL;
      setInstruction("Capture BACK");
    } else {
      pages.push({ front: pendingFront, back: dataURL });
      pendingFront = null;
      setInstruction("Capture FRONT");
      updatePagesButton();
    }
  }

  // ---------------- PAGES SCREEN ----------------
  function renderPages(){
    var list = $("pagesList");
    var empty = $("pagesEmpty");
    list.innerHTML = "";

    if (pages.length === 0){
      empty.classList.remove("hidden");
    } else {
      empty.classList.add("hidden");
    }

    pages.forEach(function(page, idx){
      var card = document.createElement("div");
      card.className = "pageCard";

      var meta = document.createElement("div");
      meta.className = "pageMeta";
      meta.textContent = "#" + (idx + 1);

      var thumbs = document.createElement("div");
      thumbs.className = "pageThumbs";
      thumbs.appendChild(makeThumb(page.front, "FRONT", idx));
      thumbs.appendChild(makeThumb(page.back, "BACK", idx));

      var delBtn = document.createElement("button");
      delBtn.className = "deleteBtn";
      delBtn.textContent = "Delete";
      delBtn.addEventListener("click", function(){
        pages.splice(idx, 1);
        renderPages();
        updatePagesButton();
      });

      card.appendChild(meta);
      card.appendChild(thumbs);
      card.appendChild(delBtn);
      list.appendChild(card);
    });
  }

  function makeThumb(src, label, idx){
    var wrap = document.createElement("div");
    wrap.className = "thumbWrap";
    var img = document.createElement("img");
    img.src = src;
    img.alt = label + " of page " + (idx + 1);
    var lbl = document.createElement("div");
    lbl.className = "thumbLabel";
    lbl.textContent = label;
    wrap.appendChild(img);
    wrap.appendChild(lbl);
    return wrap;
  }

  // ---------------- PDF CREATION ----------------
  function createPDF(){
    if (pendingFront !== null){
      showToast("Please capture the BACK image to complete the current page before creating the PDF.");
      return;
    }
    if (pages.length === 0){
      showToast("No pages to export yet. Scan at least one page first.");
      return;
    }

    var jspdfNS = window.jspdf;
    if (!jspdfNS || !jspdfNS.jsPDF){
      showToast("PDF library failed to load. Check your internet connection and reload the page.");
      return;
    }

    var createBtn = $("createPdfBtn");
    var originalText = createBtn.textContent;
    createBtn.disabled = true;
    createBtn.textContent = "Creating PDF…";

    // Let the UI update before the (potentially heavy) synchronous work starts
    setTimeout(function(){
      try{
        var jsPDF = jspdfNS.jsPDF;
        var doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4", compress: true });

        var pageW = 210, pageH = 297;
        var cardW = 150;
        var cardH = cardW / 1.586; // preserves the credit-card ratio
        var gap = 18;
        var totalH = (cardH * 2) + gap;
        var startX = (pageW - cardW) / 2;
        var frontY = (pageH - totalH) / 2;
        var backY = frontY + cardH + gap;

        for (var i = 0; i < pages.length; i++){
          if (i > 0){ doc.addPage("a4", "portrait"); }
          var page = pages[i];

          doc.addImage(page.front, "JPEG", startX, frontY, cardW, cardH, undefined, "MEDIUM");
          doc.addImage(page.back, "JPEG", startX, backY, cardW, cardH, undefined, "MEDIUM");

          doc.setFontSize(9);
          doc.setTextColor(90, 90, 90);
          doc.text("FRONT", startX, frontY - 3);
          doc.text("BACK", startX, backY - 3);

          doc.setFontSize(8);
          doc.setTextColor(150, 150, 150);
          doc.text("Page " + (i + 1) + " of " + pages.length, pageW / 2, pageH - 8, { align: "center" });
        }

        var dateStr = new Date().toISOString().slice(0, 10);
        doc.save("scanned-document-" + dateStr + ".pdf");
        showToast("PDF created successfully.");
      } catch(err){
        console.error("PDF creation failed:", err);
        showToast("Could not create the PDF: " + (err && err.message ? err.message : "Unknown error."));
      } finally {
        createBtn.disabled = false;
        createBtn.textContent = originalText;
      }
    }, 30);
  }

  // ---------------- EVENT WIRING ----------------
  document.addEventListener("DOMContentLoaded", function(){
    $("captureBtn").addEventListener("click", captureFrame);
    $("switchCamBtn").addEventListener("click", switchCamera);
    $("filterBtn").addEventListener("click", cycleFilterMode);
    updateFilterUI();

    $("pagesBtn").addEventListener("click", function(){
      renderPages();
      showScreen("pagesScreen");
    });

    $("backToCameraBtn").addEventListener("click", function(){
      showScreen("cameraScreen");
    });

    $("createPdfBtn").addEventListener("click", createPDF);

    $("retryCamBtn").addEventListener("click", function(){
      startCamera(facingMode);
    });

    startCamera("environment");
  });

})();
</script>
</body>
</html>
