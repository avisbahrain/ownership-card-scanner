<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Document Scanner</title>

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

button {
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* =========================================================
   CAMERA
========================================================= */

#cameraContainer {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #000;
}

#video {
    position: absolute;

    /*
      Fill the entire screen.
      No black bars.
    */
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;
}

/*
  Small hidden canvas used for capturing.
*/
#canvas {
    display: none;
}

/* =========================================================
   OVERLAY
========================================================= */

#overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

/*
  Credit-card / ID-1 ratio:
  85.60 / 53.98 = 1.5858
*/

#guide {
    position: absolute;

    width: min(88vw, 650px);

    aspect-ratio: 1.586 / 1;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border: 3px solid rgba(255,255,255,.95);

    border-radius: 12px;

    box-shadow:
        0 0 0 9999px rgba(0,0,0,.32);

    transition:
        border-color .2s,
        box-shadow .2s;
}

#guide.ready {
    border-color: #00e676;
}

#guide.warning {
    border-color: #ffca28;
}

/* =========================================================
   CORNERS
========================================================= */

.corner {
    position: absolute;

    width: 35px;
    height: 35px;
}

.corner.tl {
    top: -3px;
    left: -3px;

    border-top: 5px solid white;
    border-left: 5px solid white;

    border-radius: 10px 0 0 0;
}

.corner.tr {
    top: -3px;
    right: -3px;

    border-top: 5px solid white;
    border-right: 5px solid white;

    border-radius: 0 10px 0 0;
}

.corner.bl {
    bottom: -3px;
    left: -3px;

    border-bottom: 5px solid white;
    border-left: 5px solid white;

    border-radius: 0 0 0 10px;
}

.corner.br {
    bottom: -3px;
    right: -3px;

    border-bottom: 5px solid white;
    border-right: 5px solid white;

    border-radius: 0 0 10px 0;
}

/* =========================================================
   TOP BAR
========================================================= */

#topBar {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    padding:
        calc(env(safe-area-inset-top) + 14px)
        16px
        16px;

    background:
        linear-gradient(
            rgba(0,0,0,.78),
            rgba(0,0,0,0)
        );

    color: white;

    text-align: center;

    z-index: 20;
}

#title {
    font-size: 20px;
    font-weight: 700;
}

#instruction {
    margin-top: 6px;

    font-size: 15px;
    font-weight: 600;
}

#pageInfo {
    margin-top: 5px;

    font-size: 12px;

    opacity: .85;
}

/* =========================================================
   STATUS
========================================================= */

#status {
    position: absolute;

    top: calc(
        env(safe-area-inset-top) + 105px
    );

    left: 50%;

    transform: translateX(-50%);

    z-index: 30;

    padding: 8px 14px;

    border-radius: 20px;

    background: rgba(0,0,0,.68);

    color: white;

    font-size: 13px;

    white-space: nowrap;

    max-width: 90vw;

    overflow: hidden;

    text-overflow: ellipsis;
}

/* =========================================================
   BOTTOM CONTROLS
========================================================= */

#bottom {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        15px
        16px
        calc(env(safe-area-inset-bottom) + 16px);

    background:
        linear-gradient(
            rgba(0,0,0,0),
            rgba(0,0,0,.92)
        );

    z-index: 30;
}

/* =========================================================
   CAPTURE BUTTON
========================================================= */

#captureButton {
    position: relative;

    display: block;

    width: 82px;
    height: 82px;

    margin: 0 auto 15px;

    padding: 0;

    border-radius: 50%;

    border: 6px solid white;

    background: white;

    box-shadow:
        0 4px 18px rgba(0,0,0,.55);

    cursor: pointer;

    touch-action: manipulation;
}

#captureButton::after {
    content: "";

    position: absolute;

    width: 64px;
    height: 64px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #e53935;

    transition: transform .1s;
}

#captureButton:active::after {
    transform:
        translate(-50%, -50%)
        scale(.88);
}

#captureButton:disabled {
    opacity: .45;
}

/* =========================================================
   BUTTONS
========================================================= */

.buttons {
    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;
}

button {
    border: none;

    padding: 12px 18px;

    border-radius: 10px;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    touch-action: manipulation;
}

.secondary {
    background: rgba(255,255,255,.94);

    color: #111;
}

.primary {
    background: #1976d2;

    color: white;
}

.success {
    background: #00a86b;

    color: white;
}

.danger {
    background: #e53935;

    color: white;
}

/* =========================================================
   PAGES PANEL
========================================================= */

#pagesPanel {
    position: absolute;

    inset: 0;

    z-index: 100;

    display: none;

    background: #f5f5f5;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;
}

#pagesHeader {
    position: sticky;

    top: 0;

    background: white;

    padding:
        calc(env(safe-area-inset-top) + 15px)
        15px
        15px;

    border-bottom: 1px solid #ddd;

    z-index: 5;
}

#pagesHeader h2 {
    margin: 0 0 5px;

    font-size: 22px;
}

#pagesHeader p {
    margin: 0;

    color: #666;

    font-size: 14px;
}

#pages {
    padding: 15px;
}

/* =========================================================
   PAGE CARD
========================================================= */

.page {
    background: white;

    border-radius: 12px;

    padding: 12px;

    margin-bottom: 15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.12);
}

.pageTitle {
    font-weight: 700;

    margin-bottom: 10px;
}

.photos {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}

.photoBox {
    min-width: 0;
}

.photoBox img {
    display: block;

    width: 100%;

    aspect-ratio: 1.586 / 1;

    object-fit: cover;

    border-radius: 8px;

    background: #ddd;
}

.photoLabel {
    margin-top: 5px;

    text-align: center;

    font-size: 12px;

    font-weight: 700;

    color: #555;
}

.deletePage {
    width: 100%;

    margin-top: 10px;

    background: #ffebee;

    color: #c62828;
}

/* =========================================================
   EMPTY PAGES
========================================================= */

.empty {
    text-align: center;

    padding: 50px 20px;

    color: #777;
}

/* =========================================================
   MESSAGE
========================================================= */

#message {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.75);

    z-index: 500;
}

.messageBox {
    width: min(90%, 420px);

    background: white;

    border-radius: 15px;

    padding: 25px;

    text-align: center;

    box-shadow:
        0 10px 40px rgba(0,0,0,.35);
}

.messageBox h3 {
    margin:
        0
        0
        10px;
}

.messageBox p {
    margin: 0;

    color: #555;

    line-height: 1.5;
}

.messageBox button {
    width: 100%;

    margin-top: 18px;
}

/* =========================================================
   PROCESSING
========================================================= */

#processing {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    background: rgba(0,0,0,.88);

    z-index: 1000;

    color: white;

    text-align: center;
}

.loader {
    width: 48px;
    height: 48px;

    margin:
        0
        auto
        16px;

    border:
        5px solid rgba(255,255,255,.25);

    border-top-color: white;

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   FLASH
========================================================= */

#flash {
    position: fixed;

    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 900;

    transition: opacity .15s;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    #guide {
        width: 90vw;
    }

    #captureButton {
        width: 76px;
        height: 76px;
    }

    #captureButton::after {
        width: 60px;
        height: 60px;
    }

    button {
        padding:
            11px 14px;

        font-size: 13px;
    }
}

/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 800px) {

    #guide {
        width: 650px;
    }

    #bottom {
        padding-bottom: 25px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- =====================================================
         CAMERA
    ====================================================== -->

    <div id="cameraContainer">

        <video
            id="video"
            autoplay
            muted
            playsinline>
        </video>

        <div id="overlay">

            <div id="guide">

                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>

            </div>

        </div>

        <div id="topBar">

            <div id="title">
                Document Scanner
            </div>

            <div id="instruction">
                Capture FRONT
            </div>

            <div id="pageInfo">
                Page 1 • Front
            </div>

        </div>

        <div id="status">
            Position the document inside the frame
        </div>

        <div id="bottom">

            <!-- REAL MANUAL CAPTURE BUTTON -->

            <button
                id="captureButton"
                aria-label="Capture">
            </button>

            <div class="buttons">

                <button
                    class="secondary"
                    id="cameraButton">
                    🔄 Camera
                </button>

                <button
                    class="secondary"
                    id="pagesButton">
                    📄 Pages (<span id="pageCount">0</span>)
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         PAGES
    ====================================================== -->

    <div id="pagesPanel">

        <div id="pagesHeader">

            <h2>
                Scanned Pages
            </h2>

            <p>
                Each page contains exactly Front + Back.
            </p>

            <div
                class="buttons"
                style="margin-top:12px">

                <button
                    class="primary"
                    id="continueButton">
                    📷 Continue Scanning
                </button>

                <button
                    class="success"
                    id="pdfButton">
                    📄 Create PDF
                </button>

            </div>

        </div>

        <div id="pages"></div>

    </div>


    <!-- =====================================================
         MESSAGE
    ====================================================== -->

    <div id="message">

        <div class="messageBox">

            <h3 id="messageTitle">
                Error
            </h3>

            <p id="messageText"></p>

            <button
                class="primary"
                id="messageOK">
                OK
            </button>

        </div>

    </div>


    <!-- =====================================================
         PROCESSING
    ====================================================== -->

    <div id="processing">

        <div>

            <div class="loader"></div>

            <div id="processingText">
                Creating PDF...
            </div>

        </div>

    </div>


    <div id="flash"></div>

</div>


<canvas id="canvas"></canvas>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const guide =
    document.getElementById("guide");

const instruction =
    document.getElementById("instruction");

const pageInfo =
    document.getElementById("pageInfo");

const statusText =
    document.getElementById("status");

const captureButton =
    document.getElementById("captureButton");

const cameraButton =
    document.getElementById("cameraButton");

const pagesButton =
    document.getElementById("pagesButton");

const continueButton =
    document.getElementById("continueButton");

const pdfButton =
    document.getElementById("pdfButton");

const pageCount =
    document.getElementById("pageCount");

const pagesPanel =
    document.getElementById("pagesPanel");

const pagesContainer =
    document.getElementById("pages");

const message =
    document.getElementById("message");

const messageTitle =
    document.getElementById("messageTitle");

const messageText =
    document.getElementById("messageText");

const messageOK =
    document.getElementById("messageOK");

const processing =
    document.getElementById("processing");

const processingText =
    document.getElementById("processingText");

const flash =
    document.getElementById("flash");


/* =========================================================
   STATE
========================================================= */

let stream = null;

let facingMode = "environment";

let currentSide = "front";

let currentFront = null;

let pagesData = [];

let cameraStarting = false;


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

    if (cameraStarting) {
        return;
    }

    cameraStarting = true;

    captureButton.disabled = true;

    try {

        /*
          Stop old camera.
        */

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

            stream = null;
        }


        /*
          Check browser support.
        */

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Camera API is not supported."
            );
        }


        /*
          IMPORTANT:
          We do NOT force 16:9.

          The browser chooses the best
          available camera resolution.
        */

        const constraints = {

            audio: false,

            video: {

                facingMode: {
                    ideal: facingMode
                },

                width: {
                    ideal: 2560
                },

                height: {
                    ideal: 1440
                }
            }
        };


        stream =
            await navigator
                .mediaDevices
                .getUserMedia(
                    constraints
                );


        video.srcObject =
            stream;


        await new Promise(
            resolve => {

                if (
                    video.readyState >= 2
                ) {

                    resolve();

                } else {

                    video.onloadedmetadata =
                        () => resolve();

                }

            }
        );


        await video.play();


        statusText.textContent =
            "Position document inside the frame";


        guide.classList.remove(
            "warning"
        );

        guide.classList.add(
            "ready"
        );


        captureButton.disabled =
            false;


    } catch (error) {

        console.error(
            "CAMERA ERROR:",
            error
        );


        guide.classList.remove(
            "ready"
        );


        guide.classList.add(
            "warning"
        );


        let text =
            "Could not open the camera.";


        if (
            error.name ===
            "NotAllowedError"
        ) {

            text =
                "Camera permission was denied. Please allow camera access in your browser settings.";

        } else if (
            error.name ===
            "NotFoundError"
        ) {

            text =
                "No camera was found on this device.";

        } else if (
            error.name ===
            "NotReadableError"
        ) {

            text =
                "The camera is already being used by another application.";

        } else if (
            location.protocol !==
            "https:" &&
            location.hostname !==
            "localhost"
        ) {

            text =
                "Camera access normally requires HTTPS. Open this website using an HTTPS address.";

        }


        showMessage(
            "Camera Error",
            text
        );


    } finally {

        cameraStarting =
            false;

    }

}


/* =========================================================
   SWITCH CAMERA
========================================================= */

async function switchCamera() {

    facingMode =
        facingMode === "environment"
            ? "user"
            : "environment";


    await startCamera();

}


/* =========================================================
   UPDATE INSTRUCTION
========================================================= */

function updateInstruction() {

    const pageNumber =
        pagesData.length + 1;


    if (
        currentSide ===
        "front"
    ) {

        instruction.textContent =
            "Capture FRONT";

        pageInfo.textContent =
            `Page ${pageNumber} • Front`;

        statusText.textContent =
            "Position FRONT inside the frame";

    } else {

        instruction.textContent =
            "Capture BACK";

        pageInfo.textContent =
            `Page ${pageNumber} • Back`;

        statusText.textContent =
            "Position BACK inside the frame";

    }

}


/* =========================================================
   GET GUIDE RECTANGLE
========================================================= */

function getGuideRect() {

    const rect =
        guide.getBoundingClientRect();

    return {

        left: rect.left,

        top: rect.top,

        width: rect.width,

        height: rect.height

    };

}


/* =========================================================
   CAPTURE
========================================================= */

captureButton.addEventListener(
    "click",
    capturePhoto
);


async function capturePhoto() {

    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        showMessage(
            "Camera Not Ready",
            "Please wait for the camera to start."
        );

        return;

    }


    if (
        captureButton.disabled
    ) {

        return;

    }


    captureButton.disabled =
        true;


    try {

        /*
          We capture the actual
          camera resolution.
        */

        const sourceWidth =
            video.videoWidth;

        const sourceHeight =
            video.videoHeight;


        /*
          Camera/video is displayed with
          object-fit: cover.

          Therefore we calculate exactly
          which part of the camera frame
          is visible on the screen.
        */

        const videoRect =
            video.getBoundingClientRect();


        const scale =
            Math.max(

                videoRect.width /
                    sourceWidth,

                videoRect.height /
                    sourceHeight

            );


        const displayedWidth =
            sourceWidth * scale;

        const displayedHeight =
            sourceHeight * scale;


        const videoOffsetX =
            (
                displayedWidth -
                videoRect.width
            ) / 2;


        const videoOffsetY =
            (
                displayedHeight -
                videoRect.height
            ) / 2;


        const guideRect =
            getGuideRect();


        /*
          Guide coordinates relative
          to video element.
        */

        const guideX =
            guideRect.left -
            videoRect.left;

        const guideY =
            guideRect.top -
            videoRect.top;


        /*
          Convert screen pixels back
          to actual camera pixels.
        */

        let sx =
            (
                guideX +
                videoOffsetX
            ) / scale;


        let sy =
            (
                guideY +
                videoOffsetY
            ) / scale;


        let sw =
            guideRect.width /
            scale;


        let sh =
            guideRect.height /
            scale;


        /*
          Keep crop inside source.
        */

        sx =
            Math.max(
                0,
                Math.min(
                    sx,
                    sourceWidth - 1
                )
            );

        sy =
            Math.max(
                0,
                Math.min(
                    sy,
                    sourceHeight - 1
                )
            );

        sw =
            Math.min(
                sw,
                sourceWidth - sx
            );

        sh =
            Math.min(
                sh,
                sourceHeight - sy
            );


        /*
          High quality output.

          Keep the camera crop ratio.
        */

        const outputWidth =
            1712;

        const outputHeight =
            Math.round(
                outputWidth *
                sh /
                sw
            );


        canvas.width =
            outputWidth;

        canvas.height =
            outputHeight;


        const ctx =
            canvas.getContext(
                "2d",
                {
                    alpha: false
                }
            );


        /*
          Reset transform.
        */

        ctx.setTransform(
            1,
            0,
            0,
            1,
            0,
            0
        );


        /*
          Mirror front camera only.
        */

        if (
            facingMode ===
            "user"
        ) {

            ctx.translate(
                outputWidth,
                0
            );

            ctx.scale(
                -1,
                1
            );

        }


        /*
          Draw only what is inside
          the document guide.
        */

        ctx.drawImage(

            video,

            sx,
            sy,
            sw,
            sh,

            0,
            0,
            outputWidth,
            outputHeight

        );


        /*
          JPEG.
        */

        const image =
            canvas.toDataURL(
                "image/jpeg",
                0.94
            );


        /*
          FRONT
        */

        if (
            currentSide ===
            "front"
        ) {

            currentFront =
                image;

            currentSide =
                "back";


            updateInstruction();

            flashScreen();


            statusText.textContent =
                "Front captured. Now capture BACK.";


        }

        /*
          BACK
        */

        else {

            if (!currentFront) {

                throw new Error(
                    "Front image is missing."
                );

            }


            pagesData.push({

                front:
                    currentFront,

                back:
                    image

            });


            currentFront =
                null;

            currentSide =
                "front";


            updatePageCount();

            renderPages();

            updateInstruction();

            flashScreen();


            statusText.textContent =
                "Page completed. Capture FRONT for the next page.";

        }


    } catch (error) {

        console.error(
            "CAPTURE ERROR:",
            error
        );


        showMessage(
            "Capture Failed",
            "The image could not be captured. Please try again."
        );


    } finally {

        captureButton.disabled =
            false;

    }

}


/* =========================================================
   FLASH
========================================================= */

function flashScreen() {

    flash.style.opacity =
        "0.85";


    setTimeout(
        () => {

            flash.style.opacity =
                "0";

        },
        70
    );

}


/* =========================================================
   PAGE COUNT
========================================================= */

function updatePageCount() {

    pageCount.textContent =
        pagesData.length;

}


/* =========================================================
   RENDER PAGES
========================================================= */

function renderPages() {

    pagesContainer.innerHTML =
        "";


    if (
        pagesData.length === 0
    ) {

        pagesContainer.innerHTML = `

            <div class="empty">

                <div style="font-size:40px">
                    📄
                </div>

                <div style="
                    margin-top:10px;
                    font-weight:bold;
                ">
                    No pages scanned yet
                </div>

                <div style="
                    margin-top:6px;
                ">
                    Capture Front and Back
                    to create your first page.
                </div>

            </div>

        `;

        return;

    }


    pagesData.forEach(
        (page, index) => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "page";


            element.innerHTML = `

                <div class="pageTitle">
                    Page ${index + 1}
                </div>

                <div class="photos">

                    <div class="photoBox">

                        <img
                            src="${page.front}"
                            alt="Front">

                        <div class="photoLabel">
                            FRONT
                        </div>

                    </div>

                    <div class="photoBox">

                        <img
                            src="${page.back}"
                            alt="Back">

                        <div class="photoLabel">
                            BACK
                        </div>

                    </div>

                </div>

                <button
                    class="deletePage"
                    data-index="${index}">

                    🗑 Delete Page

                </button>

            `;


            const deleteButton =
                element.querySelector(
                    ".deletePage"
                );


            deleteButton.addEventListener(
                "click",
                () => deletePage(index)
            );


            pagesContainer.appendChild(
                element
            );

        }
    );

}


/* =========================================================
   DELETE PAGE
========================================================= */

function deletePage(index) {

    if (
        !confirm(
            `Delete Page ${index + 1}?`
        )
    ) {

        return;

    }


    pagesData.splice(
        index,
        1
    );


    updatePageCount();

    renderPages();

    updateInstruction();

}


/* =========================================================
   OPEN PAGES
========================================================= */

function openPages() {

    pagesPanel.style.display =
        "block";


    renderPages();

}


/* =========================================================
   CONTINUE SCANNING
========================================================= */

function continueScanning() {

    pagesPanel.style.display =
        "none";


    updateInstruction();


    /*
      Make sure camera is running.
    */

    if (
        !stream ||
        stream.getVideoTracks()
            .some(
                track =>
                    track.readyState ===
                    "live"
            )
    ) {

        startCamera();

    }

}


/* =========================================================
   CREATE PDF
========================================================= */

async function createPDF() {

    /*
      No pages.
    */

    if (
        pagesData.length === 0
    ) {

        showMessage(
            "No Pages",
            "Please scan at least one complete page."
        );

        return;

    }


    /*
      Incomplete front.
    */

    if (
        currentFront
    ) {

        showMessage(
            "Incomplete Page",
            "The current page has a FRONT image but no BACK image. Capture the BACK before creating the PDF."
        );

        return;

    }


    processing.style.display =
        "flex";


    pdfButton.disabled =
        true;


    try {

        if (
            !window.jspdf ||
            !window.jspdf.jsPDF
        ) {

            throw new Error(
                "jsPDF library was not loaded."
            );

        }


        const {
            jsPDF
        } =
            window.jspdf;


        /*
          A4 landscape.

          Each PDF page contains:

          LEFT  = FRONT
          RIGHT = BACK
        */

        const pdf =
            new jsPDF({

                orientation:
                    "landscape",

                unit:
                    "mm",

                format:
                    "a4",

                compress:
                    true

            });


        const pdfWidth =
            297;

        const pdfHeight =
            210;


        const margin =
            12;

        const gap =
            8;


        const availableWidth =
            pdfWidth -
            margin * 2 -
            gap;


        const imageWidth =
            availableWidth / 2;


        const imageHeight =
            imageWidth / 1.586;


        const y =
            (
                pdfHeight -
                imageHeight
            ) / 2;


        for (
            let i = 0;
            i < pagesData.length;
            i++
        ) {

            if (
                i > 0
            ) {

                pdf.addPage();

            }


            processingText.textContent =
                `Creating PDF page ${i + 1} of ${pagesData.length}...`;


            /*
              FRONT
            */

            pdf.addImage(

                pagesData[i].front,

                "JPEG",

                margin,

                y,

                imageWidth,

                imageHeight,

                "front-" + i,

                "MEDIUM"

            );


            /*
              BACK
            */

            pdf.addImage(

                pagesData[i].back,

                "JPEG",

                margin +
                    imageWidth +
                    gap,

                y,

                imageWidth,

                imageHeight,

                "back-" + i,

                "MEDIUM"

            );


            /*
              Small labels.
            */

            pdf.setFont(
                "helvetica",
                "bold"
            );

            pdf.setFontSize(
                8
            );


            pdf.text(
                "FRONT",
                margin,
                y - 3
            );


            pdf.text(
                "BACK",
                margin +
                    imageWidth +
                    gap,
                y - 3
            );

        }


        processingText.textContent =
            "Preparing download...";


        /*
          Create Blob.

          This is more reliable than
          relying only on pdf.save().
        */

        const blob =
            pdf.output(
                "blob"
            );


        if (
            !blob ||
            blob.size === 0
        ) {

            throw new Error(
                "PDF blob is empty."
            );

        }


        const filename =
            "scanned-document-" +
            getDateString() +
            ".pdf";


        /*
          Download.
        */

        downloadBlob(
            blob,
            filename
        );


        processing.style.display =
            "none";


    } catch (error) {

        console.error(
            "PDF ERROR:",
            error
        );


        processing.style.display =
            "none";


        showMessage(
            "PDF Creation Failed",
            "The PDF could not be created. Please try again. If the problem continues, reduce the number of scanned pages."
        );


    } finally {

        pdfButton.disabled =
            false;

    }

}


/* =========================================================
   DATE
========================================================= */

function getDateString() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =========================================================
   DOWNLOAD BLOB
========================================================= */

function downloadBlob(
    blob,
    filename
) {

    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;

    link.download =
        filename;

    link.style.display =
        "none";


    document.body.appendChild(
        link
    );


    link.click();


    setTimeout(
        () => {

            link.remove();

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    title,
    text
) {

    messageTitle.textContent =
        title;

    messageText.textContent =
        text;

    message.style.display =
        "flex";

}


function closeMessage() {

    message.style.display =
        "none";

}


messageOK.addEventListener(
    "click",
    closeMessage
);


/* =========================================================
   BUTTON EVENTS
========================================================= */

cameraButton.addEventListener(
    "click",
    switchCamera
);


pagesButton.addEventListener(
    "click",
    openPages
);


continueButton.addEventListener(
    "click",
    continueScanning
);


pdfButton.addEventListener(
    "click",
    createPDF
);


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    async () => {

        updateInstruction();

        updatePageCount();

        renderPages();

        await startCamera();

    }
);


/* =========================================================
   STOP CAMERA
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

    }
);

</script>
